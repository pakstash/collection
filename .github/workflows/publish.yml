name: Build and Publish

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated image names to build; empty builds everything"
        required: false
        default: ""
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest

    outputs:
      owner: ${{ steps.manifest.outputs.owner }}
      runtimes: ${{ steps.manifest.outputs.runtimes }}
      images: ${{ steps.manifest.outputs.images }}

    steps:
      - uses: actions/checkout@v4

      - name: Discover build targets
        id: manifest
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGES: ${{ inputs.images || '' }}
        run: python scripts/discover-images.py github-outputs >> "$GITHUB_OUTPUT"

  publish-runtimes:
    needs: discover
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.images == '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtimes
        env:
          OWNER: ${{ needs.discover.outputs.owner }}
        run: python scripts/discover-images.py build-runtimes

  publish:
    needs:
      - discover
      - publish-runtimes
    if: ${{ always() && needs.discover.result == 'success' && (needs.publish-runtimes.result == 'success' || needs.publish-runtimes.result == 'skipped') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.image.directory }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.directory }}/Dockerfile
          build-args: |
            OWNER=${{ needs.discover.outputs.owner }}
          push: true
          tags: ${{ matrix.image.tag }}
